name: Build Nain Music Wix Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build widget
        run: npm run build:widget
      - name: Verify single self-contained JS bundle
        run: |
          test -s dist-widget/nain-music-widget.js
          test "$(find dist-widget -type f | wc -l)" -eq 1
          test "$(find dist-widget -type f -name '*.js' | wc -l)" -eq 1
          test "$(find dist-widget -type f -name '*.css' | wc -l)" -eq 0
          grep -q "customElements" dist-widget/nain-music-widget.js
          if grep -Eq 'import[[:space:]]*\(|from[[:space:]]+["'"'"']|\.css(["'"''])?' dist-widget/nain-music-widget.js; then exit 1; fi
          wc -c dist-widget/nain-music-widget.js
      - uses: actions/upload-artifact@v4
        with:
          name: nain-music-widget
          path: dist-widget/nain-music-widget.js
          if-no-files-found: error