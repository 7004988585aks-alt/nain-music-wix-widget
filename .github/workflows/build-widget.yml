name: Build Nain Music Wix Widget

on:
  push:
    branches: [main]
    paths:
      - 'nain-music-wix-widget-ready-fixed-source.zip'
      - '.github/workflows/build-widget.yml'
  workflow_dispatch:

jobs:
  build-widget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -f nain-music-wix-widget-ready-fixed-source.zip
          unzip -l nain-music-wix-widget-ready-fixed-source.zip | head -40

      - name: Extract source archive
        run: |
          rm -rf source
          mkdir source
          unzip -q nain-music-wix-widget-ready-fixed-source.zip -d source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package.json

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Build widget
        working-directory: source
        run: npm run build:widget

      - name: Verify widget artifact
        working-directory: source
        run: |
          test -s dist-widget/nain-music-widget.js
          wc -c dist-widget/nain-music-widget.js

      - name: Upload widget artifact
        uses: actions/upload-artifact@v4
        with:
          name: nain-music-widget
          path: source/dist-widget/nain-music-widget.js
          if-no-files-found: error
