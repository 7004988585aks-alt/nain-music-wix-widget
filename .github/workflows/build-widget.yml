name: Build Nain Music Wix Widget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Build widget
        run: bun run build:widget

      - name: Diagnose widget output
        run: |
          find dist-widget -maxdepth 2 -type f -print || true
          ls -lah dist-widget || true
          if [ ! -d dist-widget ]; then
            echo "dist-widget does not exist; workspace root:"
            ls -lah
          fi

      - name: Diagnose widget output before validation
        run: |
          pwd
          ls -lah dist-widget
          test -f dist-widget/nain-music-widget.js && echo "JS EXISTS" || echo "JS MISSING"
          wc -c dist-widget/nain-music-widget.js

      - name: Verify single self-contained JS bundle
        run: |
          test -s dist-widget/nain-music-widget.js
          test "$(find dist-widget -type f | wc -l)" -eq 1
          test "$(find dist-widget -type f -name '*.js' | wc -l)" -eq 1
          test "$(find dist-widget -type f -name '*.css' | wc -l)" -eq 0
          grep -q "customElements" dist-widget/nain-music-widget.js
          if grep -Eq 'import[[:space:]]*\(|from[[:space:]]+["'"'"']|\.css(["'"''])?' dist-widget/nain-music-widget.js; then exit 1; fi
          wc -c dist-widget/nain-music-widget.js

      - name: Upload widget artifact
        uses: actions/upload-artifact@v4
        with:
          name: nain-music-widget
          path: dist-widget/nain-music-widget.js
          if-no-files-found: error